<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090F14">
  <meta name="description" content="Movies, series, live TV and your personal library with your Neon TV subscription.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Neon TV">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Neon TV</title>
  <style>
    html, body { margin: 0; height: 100%; background: #090f14; color: #f4f5f2; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font: 14px system-ui, sans-serif; text-align: center; padding: 24px; }
    #loading img { width: 88px; height: 88px; }
    #loading p { color: #a1a8ab; margin: 0; }
    #retry { background: #62c5d8; color: #102126; padding: 12px 24px; border: 0; border-radius: 12px; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <strong>NEON TV</strong>
    <p id="loading-message">Loading Neon TV…</p>
    <button id="retry" hidden>Try again</button>
  </div>
  <noscript>Neon TV requires JavaScript. Please enable it and reload.</noscript>
  <script src="pwa.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
